spring.application.name=polizas-api
server.port=${PORT:8080}

# Base de datos en memoria: se crea al arrancar y se carga con data.sql
spring.datasource.url=jdbc:h2:mem:polizasdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Seguridad mínima: valor esperado del header x-api-key
security.api-key=${API_KEY:123456}

# IPC anual (porcentaje) que se aplica al renovar
polizas.ipc-porcentaje=${IPC_PORCENTAJE:5.20}

# Servicio de edición del CORE (mock local)
core.url=${CORE_URL:http://localhost:${server.port}/core-mock/evento}
